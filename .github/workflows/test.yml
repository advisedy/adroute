name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test native platform, proxy and CLI lifecycle
        run: go test ./... -count=1 -timeout=10m
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o dist/ ./cmd/adroute
